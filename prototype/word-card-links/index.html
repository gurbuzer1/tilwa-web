<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tilwa — Kelime Bağlantıları Prototipi</title>
  <style>
    /* PROTOTYPE: Three word-card link layouts, switchable with ?variant=A|B|C. */
    @font-face{font-family:Lateef;src:url('./lateef-arabic-700-normal.woff2') format('woff2');font-display:swap}
    :root{--ink:#173c33;--muted:#66776f;--green:#20624f;--green-dark:#164638;--mint:#eaf3ee;--paper:#fbf7ed;--gold:#a77d2f;--line:#d9e1dc;--white:#fff;--shadow:0 24px 64px -34px rgba(18,63,51,.52)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;color:var(--ink);background:linear-gradient(180deg,#edf5f0 0,#f7f4eb 62%,#efe9dc 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .app{width:min(100%,430px);min-height:100dvh;margin:0 auto;padding:18px 16px 104px;position:relative;background:rgba(255,255,255,.38)}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.02em}.brand-mark{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--green);font-family:Georgia,serif;font-size:21px}
    .preview-badge{padding:7px 10px;border:1px solid #cbd8d0;border-radius:999px;color:var(--green);background:rgba(255,255,255,.75);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .stage-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid #d9e3dd;border-radius:15px;background:rgba(255,255,255,.72)}
    .stage-tabs button{min-height:39px;border:0;border-radius:11px;color:var(--muted);background:transparent;font-size:13px;font-weight:750;cursor:pointer}.stage-tabs button.active{color:#fff;background:var(--green);box-shadow:0 6px 18px -10px var(--green-dark)}
    .context{margin:20px 2px 12px}.context small{display:block;color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.context h1{margin:5px 0 4px;font-size:23px;letter-spacing:-.035em}.context p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
    .sheet{position:relative;padding:17px 20px 22px;border:1px solid rgba(209,221,214,.95);border-radius:31px;background:var(--white);box-shadow:var(--shadow)}
    .handle{width:42px;height:5px;margin:0 auto 14px;border-radius:10px;background:#d9dfdb}.eyebrow{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}
    .arabic{margin:12px 0 0;text-align:center;color:var(--green);font-family:Lateef,"Noto Kufi Arabic",serif;font-size:63px;font-weight:700;line-height:1.35}.reading{text-align:center;font-size:21px;font-weight:800}.audio{min-height:43px;margin:9px auto 17px;padding:9px 14px;display:flex;align-items:center;gap:8px;border:1px solid #bfd3c8;border-radius:14px;color:var(--green);background:#f2f8f4;font-weight:760;cursor:pointer}.audio svg,.action svg{flex:0 0 auto}
    .meaning{padding:13px 2px;display:flex;justify-content:space-between;gap:16px;border-block:1px solid var(--line)}.meaning span{color:var(--muted)}.meaning strong{text-align:right;font-size:18px}
    .role{margin:14px 0;padding:14px 16px;border-radius:17px;background:var(--mint)}.role small{display:block;color:var(--green);font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.role strong{display:block;margin-top:3px;font-size:17px}.role p{margin:5px 0 0;color:#38564d;font-size:14px;line-height:1.45}
    .action{width:100%;min-height:58px;padding:11px 13px;border-radius:16px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;transition:transform .16s ease,background .16s ease}.action:active{transform:scale(.98)}.action .copy{display:grid;gap:2px;flex:1}.action strong{font-size:15px}.action small{color:inherit;opacity:.75;font-size:11px;line-height:1.3}.arrow{margin-left:auto}
    .actions-stack{display:grid;gap:9px}.root-action{border:1px solid #b9d2c5;color:var(--green);background:#edf6f1}.library-action{border:1px solid #dfc993;color:#6c511e;background:var(--paper)}
    .variant-b .journey-group{margin-top:15px;border:1px solid #c9d8d0;border-radius:20px;overflow:hidden;background:#f6faf7}.variant-b .group-title{padding:12px 15px 9px;display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.variant-b .action{border:0;border-top:1px solid #d9e4de;border-radius:0;background:transparent}.variant-b .library-action{color:#765b25;background:#fffcf5}
    .variant-c .journey-split{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:9px}.variant-c .action{min-height:104px;padding:14px;align-items:flex-start;display:grid;grid-template-columns:auto 1fr}.variant-c .action .copy{grid-column:1/-1}.variant-c .action strong{font-size:14px}.variant-c .arrow{display:none}
    .done{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:16px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-dark);font-weight:800;cursor:pointer}.done:active{transform:translateY(2px);box-shadow:0 3px 0 var(--green-dark)}
    .switcher{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;width:min(calc(100% - 28px),402px);padding:8px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border:1px solid rgba(255,255,255,.18);border-radius:19px;color:#fff;background:#173c33;box-shadow:0 18px 45px -18px rgba(12,37,31,.85)}.switcher button{height:42px;border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;background:rgba(255,255,255,.08);font-size:20px;cursor:pointer}.switcher div{text-align:center}.switcher strong{display:block;font-size:13px}.switcher small{display:block;margin-top:2px;color:#b9cbc4;font-size:10px}
    .destination{display:none;min-height:calc(100dvh - 40px);padding:22px 18px;border-radius:28px;background:#fff;box-shadow:var(--shadow)}.destination.open{display:block}.prototype-view.hidden{display:none}.back{min-height:43px;padding:8px 12px;border:1px solid var(--line);border-radius:13px;color:var(--green);background:#f5f8f6;font-weight:750;cursor:pointer}.destination .hero{margin:26px 0 18px;padding:20px;border-radius:22px;background:var(--mint)}.destination .hero small{color:var(--green);font-weight:800}.destination .hero h2{margin:8px 0 4px;font-size:25px}.destination .hero b{font-family:Lateef,serif;font-size:41px}.verse{margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:16px}.verse p{margin:0 0 6px;font-family:Lateef,serif;font-size:27px;line-height:1.6;text-align:right}.verse small{color:var(--muted)}
    @media(max-width:360px){.app{padding-inline:11px}.sheet{padding-inline:15px}.arabic{font-size:54px}.variant-c .journey-split{grid-template-columns:1fr}.variant-c .action{min-height:72px}}
  </style>
</head>
<body>
  <main class="app">
    <section id="prototypeView" class="prototype-view">
      <header class="topbar"><div class="brand"><span class="brand-mark">ت</span> Tilwa</div><span class="preview-badge">Tasarım testi</span></header>
      <nav class="stage-tabs" aria-label="Örnek aşama"><button data-stage="2">Aşama 2</button><button data-stage="3">Aşama 3</button><button data-stage="4">Aşama 4</button></nav>
      <section class="context"><small id="contextLabel">Aşama 2 · Sûreler ve dualar</small><h1>Kelime kartı bağlantıları</h1><p>İki yönlendirmenin bilgi hiyerarşisini ve dokunma alanlarını deneyin.</p></section>
      <article id="wordSheet" class="sheet">
        <div class="handle"></div><span class="eyebrow">Kelimeyi keşfet</span>
        <div id="wordArabic" class="arabic" lang="ar" dir="rtl">أَعْطَيْنَاكَ</div><div id="wordReading" class="reading">A‘taynâke</div>
        <button class="audio" id="audioButton" type="button" aria-label="Arapça kelimeyi dinle"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 10v4h3l4 4V6L8 10H5Z" fill="currentColor"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.5 7.5 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Arapça seslendirme</button>
        <div class="meaning"><span>Anlamı</span><strong id="wordMeaning">Sana verdik</strong></div>
        <section class="role"><small>Cümledeki görevi</small><strong id="wordType">Fiil</strong><p id="wordNote">Vermek fiilinin “biz sana verdik” biçimi.</p></section>
        <div id="actions"></div>
        <button class="done" type="button">Tamam</button>
      </article>
    </section>
    <section id="destination" class="destination" aria-live="polite"><button class="back" type="button">Geri dön</button><div class="hero"><small id="destinationKind"></small><h2 id="destinationTitle"></h2><b id="destinationArabic" lang="ar" dir="rtl"></b><p id="destinationCopy"></p></div><div id="destinationVerses"></div></section>
  </main>
  <aside class="switcher" aria-label="Prototip varyantları"><button id="previous" type="button" aria-label="Önceki tasarım">‹</button><div><strong id="variantName"></strong><small>Sol/sağ oklarla değiştir</small></div><button id="next" type="button" aria-label="Sonraki tasarım">›</button></aside>
  <script>
    const variants={A:'A · İki belirgin kart',B:'B · Tek keşif bölümü',C:'C · Kompakt iki sütun'};
    const words={
      2:{context:'Aşama 2 · Sûreler ve dualar',arabic:'أَعْطَيْنَاكَ',reading:'A‘taynâke',meaning:'Sana verdik',type:'Fiil',note:'Vermek fiilinin “biz sana verdik” biçimi.',root:'ع ط و',rootLabel:'Köklerle Kur’an’ı keşfet',rootHelp:'Kök ailesini ve bu kökten gelen kelimeleri aç'},
      3:{context:'Aşama 3 · Şahıs zamirleri',arabic:'هُوَ',reading:'Huve',meaning:'O (eril)',type:'İsim',note:'Eril tekil şahıs zamiri.',root:'Zamirler',rootLabel:'Kelime grubuyla Kur’an’ı keşfet',rootHelp:'Bu zamirin geçtiği ayetleri ve benzer zamirleri aç'},
      4:{context:'Aşama 4 · Fiilleri tanı',arabic:'قَالَ',reading:'Kâle',meaning:'Dedi',type:'Fiil',note:'Geçmiş zaman, üçüncü tekil eril fiil.',root:'ق و ل',rootLabel:'Köklerle Kur’an’ı keşfet',rootHelp:'Kök ailesini ve Kur’an’daki bütün geçişlerini aç'}
    };
    const verseSamples={root:[['قُلْ هُوَ اللّٰهُ أَحَدٌ','De ki: O Allah birdir. · İhlâs 112:1'],['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ','Şüphesiz biz sana Kevser’i verdik. · Kevser 108:1']],library:[['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ','Seçilen kelimenin katalog kartı'],['Okunuş · anlam · tür','Kelime Kütüphanesi ayrıntısı'] ]};
    let stage=Number(new URLSearchParams(location.search).get('stage'))||2;
    let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!variants[variant])variant='A';
    const actions=document.getElementById('actions'),sheet=document.getElementById('wordSheet');
    const icon=(kind)=>kind==='root'?'<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M8 6.5h8M8 17.5h8M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>':'<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M5 4.5h9a3 3 0 0 1 3 3v12H8a3 3 0 0 0-3 3v-18Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 7.5h2v12h-2" stroke="currentColor" stroke-width="1.8"/></svg>';
    function action(kind,title,help){return `<button type="button" class="action ${kind}-action" data-destination="${kind}">${icon(kind)}<span class="copy"><strong>${title}</strong><small>${help}</small></span><span class="arrow">›</span></button>`}
    function render(){const w=words[stage];document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',Number(b.dataset.stage)===stage));document.getElementById('contextLabel').textContent=w.context;document.getElementById('wordArabic').textContent=w.arabic;document.getElementById('wordReading').textContent=w.reading;document.getElementById('wordMeaning').textContent=w.meaning;document.getElementById('wordType').textContent=w.type;document.getElementById('wordNote').textContent=w.note;sheet.className=`sheet variant-${variant.toLowerCase()}`;const root=action('root',w.rootLabel,w.rootHelp);const library=action('library','Kelime Kütüphanesini aç','Seçili kelimenin katalog kartını doğrudan aç');actions.innerHTML=variant==='A'?`<div class="actions-stack">${root}${library}</div>`:variant==='B'?`<section class="journey-group"><div class="group-title">Kur’an’da keşfet</div>${root}${library}</section>`:`<div class="journey-split">${root}${library}</div>`;document.getElementById('variantName').textContent=variants[variant];actions.querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>openDestination(b.dataset.destination)));const p=new URLSearchParams(location.search);p.set('variant',variant);p.set('stage',stage);history.replaceState(null,'',`${location.pathname}?${p}`)}
    function openDestination(kind){const w=words[stage],isRoot=kind==='root';document.getElementById('prototypeView').classList.add('hidden');document.getElementById('destination').classList.add('open');document.getElementById('destinationKind').textContent=isRoot?'Köklerle Kelimeler · hedef ekran':'Kelime Kütüphanesi · seçili kart';document.getElementById('destinationTitle').textContent=isRoot?(stage===3?'Zamirler kelime grubu':`${w.root} kök ailesi`):w.reading;document.getElementById('destinationArabic').textContent=isRoot?w.root:w.arabic;document.getElementById('destinationCopy').textContent=isRoot?'Bölüm 21’in mevcut görünümü değişmeden hedef olarak açılır.':'Seçilen kelime korunur; boş veya genel listeye düşmez.';document.getElementById('destinationVerses').innerHTML=verseSamples[kind].map(v=>`<article class="verse"><p lang="ar" dir="rtl">${v[0]}</p><small>${v[1]}</small></article>`).join('')}
    function closeDestination(){document.getElementById('destination').classList.remove('open');document.getElementById('prototypeView').classList.remove('hidden')}
    function cycle(delta){const keys=Object.keys(variants),i=keys.indexOf(variant);variant=keys[(i+delta+keys.length)%keys.length];render()}
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{stage=Number(b.dataset.stage);render()}));document.getElementById('previous').addEventListener('click',()=>cycle(-1));document.getElementById('next').addEventListener('click',()=>cycle(1));document.querySelector('.back').addEventListener('click',closeDestination);document.getElementById('audioButton').addEventListener('click',()=>{if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(words[stage].arabic);u.lang='ar-SA';speechSynthesis.cancel();speechSynthesis.speak(u)});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
